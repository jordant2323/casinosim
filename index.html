
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Casino Dealer Training Felt - Fixed Layout</title>
    <style>
        :root {
            --felt-color: #076324;
            --felt-border: #4a2e1b;
            --gold: #ffd700;
            --text-light: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #1a1a1a;
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 8px;
            overflow-x: hidden;
        }

        h1 {
            color: var(--gold);
            margin-bottom: 2px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 1.6rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
            text-align: center;
        }

        .subtitle {
            margin-bottom: 10px;
            color: #ccc;
            font-style: italic;
            font-size: 0.85rem;
            text-align: center;
        }

        /* Re-engineered Table Layout - Shallower bottom curve stops corner clipping */
        #game-container {
            background-color: var(--felt-color);
            width: 99vw;
            max-width: 1400px;
            border: 16px solid var(--felt-border);
            border-radius: 40px 40px 280px 280px; /* Modified radius to keep outer spots inside the wood */
            box-shadow: inset 0 0 140px rgba(0,0,0,0.9), 0 14px 28px rgba(0,0,0,0.65);
            padding: 20px 25px 40px 25px; /* Added side padding buffer */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            min-height: 460px; 
        }

        /* Table graphics print text overlay */
        .table-print {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: rgba(255, 255, 255, 0.08);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            pointer-events: none;
            width: 85%;
            font-size: 0.9rem;
            line-height: 1.5rem;
            border-bottom: 2px dashed rgba(255, 255, 255, 0.04);
            padding-bottom: 10px;
        }

        /* Casino Shoe Asset */
        .shoe-asset {
            position: absolute;
            top: 25px;
            right: 55px;
            width: 65px;
            height: 46px;
            background: linear-gradient(135deg, #222, #000);
            border-bottom: 4px solid #444;
            border-left: 8px solid #111;
            transform: rotate(-15deg);
            border-radius: 3px 8px 3px 3px;
            box-shadow: 4px 4px 8px rgba(0,0,0,0.5);
            z-index: 5;
        }
        .shoe-asset::after {
            content: '';
            position: absolute;
            left: -6px;
            bottom: 0;
            width: 14px;
            height: 12px;
            background: #111;
            transform: skewX(-25deg);
        }

        /* Dealer Area & Chip Tray */
        .dealer-container {
            align-self: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            z-index: 2;
        }

        .dealer-area {
            text-align: center;
            background: rgba(0,0,0,0.35);
            padding: 8px 20px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            width: 190px;
        }

        .chip-tray {
            display: flex;
            background: #1e1e1e;
            border: 2px solid #333;
            border-radius: 3px;
            padding: 4px 8px;
            gap: 5px;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.9);
        }

        /* Safe Proportional 3-Column Grid */
        .players-container {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px; 
            margin-top: 20px;
            margin-bottom: 25px; /* Pulls players upward away from bottom edge curve */
            width: 100%;
            z-index: 2;
        }

        /* Player Box Containers cleanly enclosed on felt */
        .player-spot {
            background: rgba(0, 0, 0, 0.45);
            border: 2px dashed rgba(255, 255, 255, 0.25);
            border-radius: 14px;
            padding: 12px 6px;
            text-align: center;
            position: relative;
            box-shadow: 0 4px 8px rgba(0,0,0,0.25);
            width: 100%;
        }

        #spot-1 { transform: rotate(1deg) translateY(-2px); }
        #spot-2 { transform: translateY(16px); }
        #spot-3 { transform: rotate(-1deg) translateY(-2px); }

        .spot-name {
            font-weight: bold;
            color: var(--gold);
            margin-bottom: 5px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Chips Style */
        .chip-wrapper {
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 5px;
        }

        .poker-chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            font-size: 0.7rem;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 1px black;
            border: 2px dashed white;
            box-shadow: 0 3px 5px rgba(0,0,0,0.4), inset 0 0 3px rgba(0,0,0,0.5);
        }
        .chip-red { background: #cc0000; }
        .chip-green { background: #006633; }
        .chip-black { background: #222222; }
        .chip-gold { background: #b89700; border-color: #ffd700; }

        .card-area {
            display: flex;
            justify-content: center;
            gap: 4px;
            min-height: 62px;
            margin: 4px 0;
            flex-wrap: nowrap;
        }

        /* Card Sizing */
        .card {
            background: #ffffff;
            color: #000000;
            border-radius: 4px;
            width: 42px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.45);
        }

        .card.red { color: #cc0000; }

        .card.back {
            background: #b00;
            background-image: radial-gradient(white 15%, transparent 16%), radial-gradient(white 15%, transparent 16%);
            background-size: 6px 6px;
            background-position: 0 0, 3px 3px;
            border: 1px solid white;
        }

        .score-badge {
            font-size: 0.75rem;
            background: rgba(0,0,0,0.85);
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
            border: 1px solid rgba(255,255,255,0.15);
            font-weight: 600;
        }

        /* Dropdowns Layout */
        .selector-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
            margin-top: 6px;
        }

        .dealer-total-select {
            background: #222;
            border: 1px solid #555;
            border-radius: 4px;
            padding: 3px 4px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            text-align: center;
            width: 92%;
            color: var(--gold);
        }
        .dealer-total-select:focus { border-color: var(--gold); }

        #control-panel {
            margin-top: 15px;
            background: #2a2a2a;
            padding: 14px;
            border-radius: 12px;
            width: 99vw;
            max-width: 1400px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.5);
            text-align: center;
        }

        .btn {
            background: linear-gradient(#4caf50, #357a38);
            color: white;
            border: none;
            padding: 8px 18px;
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin: 4px;
            box-shadow: 0 3px 0 #245226;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn:hover { background: #45a049; }
        .btn:active { transform: translateY(1px); box-shadow: none; }

        .btn-action { background: linear-gradient(#2196f3, #1565c0); box-shadow: 0 3px 0 #0d47a1; }
        .btn-audio { background: linear-gradient(#9c27b0, #6a1b9a); box-shadow: 0 3px 0 #4a148c; }

        .payment-interface {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 10px;
        }

        .payment-box {
            background: #333;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #444;
        }

        .payment-box label {
            display: block;
            margin-bottom: 4px;
            font-weight: bold;
            font-size: 0.75rem;
        }

        .payment-box select {
            width: 100%;
            padding: 4px;
            background: #1e1e1e;
            color: white;
            border: 1px solid #555;
            border-radius: 3px;
            text-align: center;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
        }

        #feedback {
            margin-top: 12px;
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 0.85rem;
            display: none;
            text-align: left;
        }

        .success { background-color: #2e7d32; color: white; border: 1px solid #1b5e20; }
        .error { background-color: #c62828; color: white; border: 1px solid #b71c1c; }
    </style>
</head>
<body>

    <h1>Happy Valley Casino</h1>
    <div class="subtitle">Simulator</div>

    <div id="game-container">
        <div class="shoe-asset"></div>

        <div class="table-print">
            Blackjack Pays 3 to 2<br>
            Table Limits: $5 Minimum - $500 Maximum
        </div>

        <div class="dealer-container">
            <div class="dealer-area">
                <div class="spot-name">DEALER (YOU)</div>
                <div class="card-area" id="dealer-cards"></div>
                <div class="score-badge" id="dealer-score">Total: --</div>
            </div>
            
            <div class="chip-tray">
                <div class="poker-chip chip-red" style="width:16px; height:16px; font-size:0.55rem; border:1px dashed white;">5</div>
                <div class="poker-chip chip-green" style="width:16px; height:16px; font-size:0.55rem; border:1px dashed white;">25</div>
                <div class="poker-chip chip-black" style="width:16px; height:16px; font-size:0.55rem; border:1px dashed white;">100</div>
            </div>
        </div>

        <div class="players-container">
            <div class="player-spot" id="spot-1">
                <div class="spot-name">Spot 1: Joe</div>
                <div class="chip-wrapper" id="chip-container-1">
                    <div class="poker-chip" id="bet-1">?</div>
                </div>
                <div class="card-area" id="cards-1"></div>
                <div class="selector-group">
                    <select class="dealer-total-select" id="score-select-1"></select>
                </div>
            </div>

            <div class="player-spot" id="spot-2">
                <div class="spot-name">Spot 2: Cathy</div>
                <div class="chip-wrapper" id="chip-container-2">
                    <div class="poker-chip" id="bet-2">?</div>
                </div>
                <div class="card-area" id="cards-2"></div>
                <div class="selector-group">
                    <select class="dealer-total-select" id="score-select-2"></select>
                </div>
            </div>

            <div class="player-spot" id="spot-3">
                <div class="spot-name">Spot 3: Bella</div>
                <div class="chip-wrapper" id="chip-container-3">
                    <div class="poker-chip" id="bet-3">?</div>
                </div>
                <div class="card-area" id="cards-3"></div>
                <div class="selector-group">
                    <select class="dealer-total-select" id="score-select-3"></select>
                </div>
            </div>
        </div>
    </div>

    <div id="control-panel">
        <div id="prompt-text" style="font-size: 0.9rem; margin-bottom: 6px; font-weight: bold;">
            Open up the table by choosing "Deal Next Hand".
        </div>

        <div id="action-buttons">
            <button class="btn" id="btn-deal" onclick="startHand()">Deal Next Hand</button>
        </div>
        
        <div style="margin-top: 4px;">
            <button class="btn btn-audio" id="btn-toggle-music" onclick="cycleMusicState()">Music: OFF</button>
        </div>

        <div id="settlement-ui" style="display: none;">
            <div style="margin: 4px 0 6px 0; font-weight: bold; color: var(--gold); font-size: 0.8rem;">
                Select matching ledger values for each hand settlement.
            </div>
            <div class="payment-interface">
                <div class="payment-box">
                    <label for="pay-1">Joe Settlement:</label>
                    <select id="pay-1"></select>
                </div>
                <div class="payment-box">
                    <label for="pay-2">Cathy Settlement:</label>
                    <select id="pay-2"></select>
                </div>
                <div class="payment-box">
                    <label for="pay-3">Bella Settlement:</label>
                    <select id="pay-3"></select>
                </div>
            </div>
            <button class="btn" style="margin-top: 10px; background: linear-gradient(#ff9800, #e65100); box-shadow: 0 3px 0 #a73a00;" onclick="verifySettlement()">Submit Payout Records</button>
        </div>

        <div id="feedback"></div>
    </div>

    <script>
        // --- Web Audio Engine ---
        let audioCtx = null;
        let musicNode = null;
        let noiseBuffer = null;
        let activeMusicOscillators = [];
        
        let musicState = 0; 
        const volumeLevels = [0.0, 0.25, 0.70]; 

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                generateNoiseBuffer();
            }
        }

        function generateNoiseBuffer() {
            const bufferSize = audioCtx.sampleRate * 0.4; 
            noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            let data = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }
        }

        function playCardSound() {
            if (!audioCtx || !noiseBuffer) return;
            try {
                let noiseSource = audioCtx.createBufferSource();
                noiseSource.buffer = noiseBuffer;

                let filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(1200, audioCtx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(350, audioCtx.currentTime + 0.12);
                filter.Q.setValueAtTime(4, audioCtx.currentTime);

                let gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);

                let bodyOsc = audioCtx.createOscillator();
                let bodyGain = audioCtx.createGain();
                bodyOsc.type = 'triangle';
                bodyOsc.frequency.setValueAtTime(180, audioCtx.currentTime);
                bodyOsc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.06);
                
                bodyGain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                bodyGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);

                noiseSource.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);

                bodyOsc.connect(bodyGain);
                bodyGain.connect(audioCtx.destination);

                noiseSource.start();
                bodyOsc.start();
                
                noiseSource.stop(audioCtx.currentTime + 0.13);
                bodyOsc.stop(audioCtx.currentTime + 0.07);
            } catch (e) { console.log("Audio blocked", e); }
        }

        function killMusic() {
            activeMusicOscillators.forEach(osc => {
                try { osc.stop(); } catch(e){}
            });
            activeMusicOscillators = [];
            if (musicNode) {
                musicNode.disconnect();
                musicNode = null;
            }
        }

        function startMusicLoop() {
            if (!audioCtx || musicNode) return; 
            
            musicNode = audioCtx.createGain();
            musicNode.gain.setValueAtTime(volumeLevels[musicState], audioCtx.currentTime); 
            musicNode.connect(audioCtx.destination);

            let time = audioCtx.currentTime;
            
            function playChord(rootFreqs, duration) {
                if (musicState === 0) return;
                
                rootFreqs.forEach((freq, idx) => {
                    let osc = audioCtx.createOscillator();
                    let g = audioCtx.createGain();
                    
                    osc.type = (idx === 0) ? 'triangle' : 'sine'; 
                    osc.frequency.setValueAtTime(freq, time);
                    
                    g.gain.setValueAtTime(0, time);
                    g.gain.linearRampToValueAtTime(0.25, time + 0.6);
                    g.gain.exponentialRampToValueAtTime(0.001, time + duration - 0.1);
                    
                    osc.connect(g);
                    g.connect(musicNode);
                    
                    osc.start(time);
                    osc.stop(time + duration);
                    activeMusicOscillators.push(osc);
                });
                
                time += duration;
                setTimeout(() => {
                    if (musicState > 0) nextStep();
                }, duration * 1000);
            }

            let progressionIndex = 0;
            const chords = [
                [130.81, 164.81, 196.00, 246.94], // Cmaj7
                [146.83, 174.61, 220.00, 261.63], // Dmin7
                [116.54, 146.83, 174.61, 207.65], // Bbmaj7
                [123.47, 155.56, 185.00, 220.00]  // Bmin7b5
            ];

            function nextStep() {
                if (musicState === 0) {
                    killMusic();
                    return;
                }
                activeMusicOscillators = activeMusicOscillators.filter(osc => {
                    try { return osc.playbackState !== undefined; } catch(e){ return false; }
                });
                
                playChord(chords[progressionIndex], 4.0);
                progressionIndex = (progressionIndex + 1) % chords.length;
            }
            
            nextStep();
        }

        function cycleMusicState() {
            initAudio();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            musicState = (musicState + 1) % 3;
            const btn = document.getElementById('btn-toggle-music');

            if (musicState === 0) {
                btn.textContent = "Music: OFF";
                killMusic();
            } else if (musicState === 1) {
                btn.textContent = "Music: LOW";
                killMusic();
                startMusicLoop();
            } else {
                btn.textContent = "Music: LOUDER";
                if (musicNode) {
                    musicNode.gain.linearRampToValueAtTime(volumeLevels[2], audioCtx.currentTime + 0.2);
                } else {
                    startMusicLoop();
                }
            }
        }

        // --- Game Setup Engine ---
        const SUITS = [
            { symbol: '♠️', red: false }, { symbol: '♥️', red: true },
            { symbol: '♣️', red: false }, { symbol: '♦️', red: true }
        ];
        
        const VALUES = [
            { name: '2', val: 2 }, { name: '3', val: 3 }, { name: '4', val: 4 },
            { name: '5', val: 5 }, { name: '6', val: 6 }, { name: '7', val: 7 },
            { name: '8', val: 8 }, { name: '9', val: 9 }, { name: '10', val: 10 },
            { name: 'J', val: 10 }, { name: 'Q', val: 10 }, { name: 'K', val: 10 },
            { name: 'A', val: 11 }
        ];

        const VALID_CASINO_BETS = [5, 15, 25, 50, 75, 100, 150, 200, 300, 400, 500];

        let deck = [];
        let gameState = {
            dealer: { cards: [], total: 0, isSoft: false },
            players: [
                { id: 1, name: 'Joe', bet: 0, cards: [], total: 0, isSoft: false, status: 'Active' },
                { id: 2, name: 'Cathy', bet: 0, cards: [], total: 0, isSoft: false, status: 'Active' },
                { id: 3, name: 'Bella', bet: 0, cards: [], total: 0, isSoft: false, status: 'Active' }
            ]
        };

        function createDeck() {
            deck = [];
            for (let d = 0; d < 6; d++) {
                for (let suit of SUITS) {
                    for (let value of VALUES) {
                        deck.push({ ...value, suit: suit.symbol, red: suit.red });
                    }
                }
            }
            shuffle();
        }

        function shuffle() {
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
        }

        function drawCard() {
            if (deck.length < 25) createDeck();
            return deck.pop();
        }

        function calculateHand(cards) {
            let total = 0;
            let aces = 0;
            for (let card of cards) {
                total += card.val;
                if (card.name === 'A') aces++;
            }
            while (total > 21 && aces > 0) {
                total -= 10;
                aces--;
            }
            return { total: total, isSoft: aces > 0 && total <= 21 };
        }

        function renderCardHTML(card, hidden = false) {
            if (hidden) return `<div class="card back"></div>`;
            return `<div class="card ${card.red ? 'red' : ''}"><span>${card.name}${card.suit}</span></div>`;
        }

        function populateAuditDropdowns() {
            gameState.players.forEach(p => {
                const countSelect = document.getElementById(`score-select-${p.id}`);
                countSelect.innerHTML = '';
                
                let defaultCountOpt = document.createElement("option");
                defaultCountOpt.textContent = "Select Count";
                defaultCountOpt.value = "none";
                countSelect.appendChild(defaultCountOpt);

                for(let i = 4; i <= 21; i++) {
                    let opt = document.createElement("option");
                    opt.textContent = `Count: ${i}`;
                    opt.value = i;
                    countSelect.appendChild(opt);
                }

                let bjOpt = document.createElement("option");
                bjOpt.textContent = "Blackjack";
                bjOpt.value = "BJ";
                countSelect.appendChild(bjOpt);

                let bustOpt = document.createElement("option");
                bustOpt.textContent = "BUST (>21)";
                bustOpt.value = "BUST";
                countSelect.appendChild(bustOpt);
            });
        }

        function startHand() {
            initAudio();
            createDeck();
            document.getElementById('feedback').style.display = 'none';
            document.getElementById('settlement-ui').style.display = 'none';
            
            // AI bots place their own bets autonomously on deal initialization
            gameState.players[0].bet = VALID_CASINO_BETS[Math.floor(Math.random() * VALID_CASINO_BETS.length)];
            gameState.players[1].bet = VALID_CASINO_BETS[Math.floor(Math.random() * VALID_CASINO_BETS.length)];
            gameState.players[2].bet = VALID_CASINO_BETS[Math.floor(Math.random() * VALID_CASINO_BETS.length)];

            gameState.dealer.cards = [];
            gameState.players.forEach(p => { p.cards = []; p.status = 'Active'; });

            gameState.players[0].cards = [drawCard(), drawCard()];
            gameState.players[1].cards = [drawCard(), drawCard()];
            gameState.players[2].cards = [drawCard(), drawCard()];
            gameState.dealer.cards = [drawCard(), drawCard()];

            playCardSound();
            populateAuditDropdowns();
            updateScoresAndUI(true);
            runAILogic();
        }

        function updateScoresAndUI(hideDealerDowncard = false) {
            gameState.players.forEach((p) => {
                const pCalc = calculateHand(p.cards);
                p.total = pCalc.total;
                p.isSoft = pCalc.isSoft;

                const chipElem = document.getElementById(`bet-${p.id}`);
                chipElem.textContent = `$${p.bet}`; // Added text value directly into the chip visual
                
                let chipClass = "chip-red";
                if (p.bet >= 500) chipClass = "chip-gold";
                else if (p.bet >= 100) chipClass = "chip-black";
                else if (p.bet >= 25) chipClass = "chip-green";
                chipElem.className = "poker-chip " + chipClass;
                
                let cardsHTML = '';
                p.cards.forEach(c => cardsHTML += renderCardHTML(c));
                document.getElementById(`cards-${p.id}`).innerHTML = cardsHTML;

                if (p.total === 21 && p.cards.length === 2) {
                    p.status = 'Blackjack';
                } else if (p.total > 21) {
                    p.status = 'Bust';
                } else {
                    p.status = 'Active';
                }
            });

            const dCalc = calculateHand(gameState.dealer.cards);
            gameState.dealer.total = dCalc.total;
            gameState.dealer.isSoft = dCalc.isSoft;

            if (hideDealerDowncard) {
                document.getElementById('dealer-cards').innerHTML = 
                    renderCardHTML(gameState.dealer.cards[0]) + renderCardHTML(null, true);
                document.getElementById('dealer-score').textContent = `Show: ${gameState.dealer.cards[0].name}`;
                document.getElementById('prompt-text').textContent = `Deal complete. Select "Reveal Downcard".`;
                
                let actionArea = document.getElementById('action-buttons');
                actionArea.innerHTML = `<button class="btn btn-action" onclick="revealDowncard()">Reveal Downcard</button>`;
            } else {
                let cardsHTML = '';
                gameState.dealer.cards.forEach(c => cardsHTML += renderCardHTML(c));
                document.getElementById('dealer-cards').innerHTML = cardsHTML;
                
                let statusText = `Total: ${gameState.dealer.total}`;
                if (gameState.dealer.isSoft && gameState.dealer.total < 21) statusText += " (Soft)";
                if (gameState.dealer.total > 21) statusText += " (BUST)";
                document.getElementById('dealer-score').textContent = statusText;
            }
        }

        function runAILogic() {
            let dealerUpcardValue = gameState.dealer.cards[0].val;

            gameState.players.forEach(p => {
                let calc = calculateHand(p.cards);
                if (calc.total === 21 && p.cards.length === 2) return; 

                while (calc.total < 21) {
                    if (!calc.isSoft) {
                        if (calc.total >= 17) break;
                        if (calc.total >= 12 && calc.total <= 16 && dealerUpcardValue <= 6) break;
                        if (calc.total === 12 && dealerUpcardValue <= 3) { p.cards.push(drawCard()); }
                    } else {
                        if (calc.total >= 19) break;
                        if (calc.total === 18 && dealerUpcardValue <= 8) break;
                    }
                    p.cards.push(drawCard());
                    calc = calculateHand(p.cards);
                }
                
                p.total = calc.total;
                if (p.total > 21) p.status = 'Bust';
            });
        }

        function revealDowncard() {
            playCardSound();
            updateScoresAndUI(false);
            evalDealerRules();
        }

        function evalDealerRules() {
            let check = calculateHand(gameState.dealer.cards);
            let mustHit = false;
            
            if (check.total < 17) {
                mustHit = true;
            } else if (check.total === 17 && check.isSoft) {
                mustHit = true;
            }

            let actionArea = document.getElementById('action-buttons');
            
            if (mustHit) {
                document.getElementById('prompt-text').innerHTML = `Total is ${check.total}. You must <span style="color:#ff4d4d; font-weight:bold;">HIT</span>.`;
                actionArea.innerHTML = `
                    <button class="btn btn-action" onclick="dealerHit()">Draw Card</button>
                `;
            } else {
                document.getElementById('prompt-text').innerHTML = `Total is ${check.total}. You must <span style="color:#4caf50; font-weight:bold;">STAND</span>.`;
                actionArea.innerHTML = `
                    <button class="btn btn-action" onclick="dealerStand()">Move to Payouts</button>
                `;
            }
        }

        function dealerHit() {
            playCardSound();
            gameState.dealer.cards.push(drawCard());
            updateScoresAndUI(false);
            evalDealerRules();
        }

        function populatePayoutDropdown(elemId, bet) {
            const select = document.getElementById(elemId);
            select.innerHTML = ''; 

            const options = [
                { text: `-- Choose Settlement --`, value: "none" },
                { text: `Player Loses (-$${bet})`, value: -bet },
                { text: `Push ($0)`, value: 0 },
                { text: `Player Wins (+$${bet})`, value: bet },
                { text: `Blackjack 3:2 Payout (+$${Math.floor(bet * 1.5)})`, value: Math.floor(bet * 1.5) }
            ];

            options.forEach(opt => {
                let el = document.createElement("option");
                el.textContent = opt.text;
                el.value = opt.value;
                select.appendChild(el);
            });
        }

        function dealerStand() {
            document.getElementById('prompt-text').textContent = "Audit card counts and payouts to complete the ledger.";
            document.getElementById('action-buttons').innerHTML = '';
            
            populatePayoutDropdown('pay-1', gameState.players[0].bet);
            populatePayoutDropdown('pay-2', gameState.players[1].bet);
            populatePayoutDropdown('pay-3', gameState.players[2].bet);
            
            document.getElementById('settlement-ui').style.display = 'block';
        }

        function verifySettlement() {
            let feedbackElement = document.getElementById('feedback');
            feedbackElement.style.display = 'block';

            let dTotal = gameState.dealer.total;
            let errors = [];

            gameState.players.forEach(p => {
                // 1. Audit Hand Total Selection
                let totalSelection = document.getElementById(`score-select-${p.id}`).value;
                if (totalSelection === "none") {
                    errors.push(`Please select the hand count total box for <strong>${p.name}</strong>.`);
                    return;
                }

                let correctTotalString = p.total.toString();
                if (p.status === 'Blackjack') correctTotalString = "BJ";
                if (p.status === 'Bust') correctTotalString = "BUST";

                if (totalSelection !== correctTotalString) {
                    let textLabel = p.status === 'Blackjack' ? "Blackjack" : p.status === 'Bust' ? "BUST" : `Total: ${p.total}`;
                    errors.push(`<strong>${p.name} Hand Count Error:</strong> You miscalculated the card values. Correct calculation is: <strong>${textLabel}</strong>.`);
                }

                // 2. Audit Payout Settlement Selection
                let settlementSelection = document.getElementById(`pay-${p.id}`).value;
                if (settlementSelection === "none") {
                    errors.push(`Please select a payout resolution outcome for <strong>${p.name}</strong>.`);
                    return;
                }

                let inputVal = parseInt(settlementSelection);
                let correctPayout = 0;

                if (p.status === 'Bust') {
                    correctPayout = -p.bet;
                } else if (p.status === 'Blackjack') {
                    let dHasBJ = (dTotal === 21 && gameState.dealer.cards.length === 2);
                    correctPayout = dHasBJ ? 0 : Math.floor(p.bet * 1.5); 
                } else if (dTotal > 21) {
                    correctPayout = p.bet;
                } else {
                    if (p.total > dTotal) {
                        correctPayout = p.bet;
                    } else if (p.total < dTotal) {
                        correctPayout = -p.bet;
                    } else {
                        correctPayout = 0;
                    }
                }

                if (inputVal !== correctPayout) {
                    let expectedText = correctPayout === 0 ? "Push ($0)" : correctPayout > 0 ? `Win (+$${correctPayout})` : `Loss (-$${Math.abs(correctPayout)})`;
                    errors.push(`<strong>${p.name} Ledger Error:</strong> Incorrect payout choice selected. Correct calculation: ${expectedText}.`);
                }
            });

            if (errors.length === 0) {
                feedbackElement.className = "success";
                feedbackElement.textContent = "Flawless Deal! Hands calculated and payouts tracked perfectly.";
                
                document.getElementById('action-buttons').innerHTML = `
                    <button class="btn" id="btn-deal" onclick="startHand()">Deal Next Hand</button>
                `;
            } else {
                feedbackElement.className = "error";
                feedbackElement.innerHTML = "<strong>Discrepancy Found:</strong><br>" + errors.join('<br>');
            }
        }
    </script>
</body>
</html>
